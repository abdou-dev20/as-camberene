# ==========================================================================
# Apache du conteneur « web »
# ==========================================================================
# Sert le site construit et transmet à l'API ce qui lui revient. La couche TLS
# n'est pas ici : c'est l'Apache de l'hôte qui la porte, et qui transmet à ce
# conteneur sur 127.0.0.1:8080.

ServerName ascamberene.sn
ServerTokens Prod
ServerSignature Off

DocumentRoot /usr/local/apache2/htdocs

# Les journaux partent sur la sortie standard : c'est `docker compose logs` qui
# les affiche, et la rotation devient l'affaire du démon.
ErrorLog  /proc/self/fd/2
CustomLog /proc/self/fd/1 combined

# --------------------------------------------------------------------------
# API et médias : transmis au conteneur de l'API
# --------------------------------------------------------------------------
# Déclarés avant le reste : mod_proxy tranche avant que la requête ne cherche
# un fichier, et /api ne tombera donc jamais sur le repli SPA.
ProxyPreserveHost On
ProxyTimeout 30

# Les envois d'images (jusqu'à 150 Mo) prennent des minutes : délai à part,
# déclaré avant /api pour que mod_proxy le retienne en premier.
LimitRequestBody 167772160
ProxyPass        /api/uploads http://api:4100/api/uploads timeout=900
ProxyPassReverse /api/uploads http://api:4100/api/uploads

ProxyPass        /api     http://api:4100/api
ProxyPassReverse /api     http://api:4100/api

ProxyPass        /uploads http://api:4100/uploads
ProxyPassReverse /uploads http://api:4100/uploads

# Rien d'autre ne part vers l'API.
ProxyPass / !

# --------------------------------------------------------------------------
# Aperçus de partage : ce que voient les robots des réseaux
# --------------------------------------------------------------------------
# Le site est une application à page unique : le serveur rend toujours le même
# index.html, et c'est le navigateur qui compose la page. Les robots de
# Facebook, WhatsApp ou X ne lancent pas le JavaScript — un lien d'article
# partagé n'afficherait donc que le titre et l'image génériques du club.
#
# Ces robots-là, et eux seuls, sont dirigés vers l'API, qui rend une page
# minimale portant les vraies balises og: du contenu. Les visiteurs continuent
# de recevoir le site normal : la condition porte sur leur user-agent, qu'aucun
# navigateur ordinaire ne revendique.
#
# Une personne qui suivrait malgré tout un de ces liens est renvoyée vers la
# page réelle par la page d'aperçu elle-même.
<IfModule mod_rewrite.c>
    RewriteEngine On

    # Site bloqué : `./deploy/docker.sh bloquer` pose le drapeau, et toute
    # requête — pages, API, images — reçoit la page d'erreur DNS. Placée en
    # tête : en contexte serveur, RewriteRule passe avant ProxyPass, et avant
    # les aperçus de partage ci-dessous. Le drapeau vit dans un volume : il
    # survit aux redéploiements.
    RewriteCond /usr/local/apache2/etat/bloque -f
    RewriteRule ^ /usr/local/apache2/htdocs/inaccessible.html [L,E=SITE_BLOQUE:1]

    # La liste est celle des réseaux qui déréférencent un lien collé dans une
    # conversation. En ajouter un ne demande que d'allonger cette alternative.
    RewriteCond %{HTTP_USER_AGENT} (facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|Discordbot|SkypeUriPreview|redditbot|Pinterest) [NC]
    RewriteRule ^/news/([a-f0-9]{24})/?$ http://api:4100/api/share/article/$1 [P,L]

    # Un match se partage par la billetterie, qui le présélectionne :
    # /billetterie?match=<id>. L'identifiant vit dans la chaîne de requête, d'où
    # la seconde condition ; le « ? » final de la cible l'enlève, pour ne pas la
    # transmettre deux fois.
    RewriteCond %{HTTP_USER_AGENT} (facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|TelegramBot|Slackbot|Discordbot|SkypeUriPreview|redditbot|Pinterest) [NC]
    RewriteCond %{QUERY_STRING} (?:^|&)match=([a-f0-9]{24})(?:&|$)
    RewriteRule ^/billetterie/?$ http://api:4100/api/share/match/%1? [P,L]
</IfModule>

<Directory /usr/local/apache2/htdocs>
    Require all granted
    Options -Indexes +FollowSymLinks
    AllowOverride None

    # Application à page unique : toute route inconnue rend index.html, et
    # c'est le routeur du navigateur qui décide. Sans cela, un rechargement
    # sur /admin/commandes donnerait un 404.
    FallbackResource /index.html
</Directory>

# Les fichiers de /assets/ portent une empreinte dans leur nom : un changement
# de contenu change le nom, ils peuvent donc être gardés indéfiniment.
<Directory /usr/local/apache2/htdocs/assets>
    Header set Cache-Control "public, max-age=31536000, immutable"
</Directory>

# index.html désigne la version des assets : il ne doit jamais venir d'un cache.
<Files "index.html">
    Header set Cache-Control "no-cache, must-revalidate"
</Files>

<IfModule mod_deflate.c>
    # `text/javascript` est indispensable : c'est le type qu'Apache donne aux
    # fichiers .js, et l'omettre laissait passer le bundle — le plus gros
    # fichier du site — sans compression.
    AddOutputFilterByType DEFLATE \
        text/html text/plain text/css text/javascript \
        application/javascript application/json application/xml \
        image/svg+xml
</IfModule>

# La page de blocage ne doit rester dans aucun cache : au déblocage, le site
# doit revenir au premier rechargement.
Header always set Cache-Control "no-store" env=SITE_BLOQUE

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
