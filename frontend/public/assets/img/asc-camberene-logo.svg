<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Bouclier principal -->
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F9ED3A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E6D532;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F9ED3A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D7C27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A5E1F;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <dropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Forme du bouclier -->
  <path d="M60 10 C40 10, 20 20, 20 40 L20 70 C20 90, 40 105, 60 110 C80 105, 100 90, 100 70 L100 40 C100 20, 80 10, 60 10 Z" 
        fill="url(#shieldGradient)" 
        stroke="url(#greenAccent)" 
        stroke-width="2"
        filter="url(#shadow)"/>
  
  <!-- Accent vert en haut -->
  <path d="M60 10 C45 10, 30 15, 25 25 L25 30 C30 20, 45 15, 60 15 C75 15, 90 20, 95 30 L95 25 C90 15, 75 10, 60 10 Z" 
        fill="url(#greenAccent)" 
        opacity="0.8"/>
  
  <!-- Ballon de football stylisé -->
  <circle cx="60" cy="45" r="15" fill="#FFFFFF" stroke="url(#greenAccent)" stroke-width="1.5"/>
  <path d="M50 40 L70 40 M55 35 L65 35 M55 50 L65 50 M50 45 L70 45" 
        stroke="url(#greenAccent)" 
        stroke-width="1" 
        opacity="0.7"/>
  
  <!-- Texte ASC -->
  <text x="60" y="80" 
        text-anchor="middle" 
        font-family="Inter, sans-serif" 
        font-weight="900" 
        font-size="18" 
        fill="#000000"
        letter-spacing="1px">ASC</text>
  
  <!-- Année de fondation -->
  <text x="60" y="95" 
        text-anchor="middle" 
        font-family="Inter, sans-serif" 
        font-weight="600" 
        font-size="8" 
        fill="url(#greenAccent)"
        opacity="0.8">1965</text>
  
  <!-- Étoiles décoratives -->
  <polygon points="30,25 32,30 37,30 33,33 35,38 30,35 25,38 27,33 23,30 28,30" 
           fill="url(#greenAccent)" 
           opacity="0.6"/>
  <polygon points="90,25 92,30 97,30 93,33 95,38 90,35 85,38 87,33 83,30 88,30" 
           fill="url(#greenAccent)" 
           opacity="0.6"/>
  
  <!-- Bordure décorative en bas -->
  <path d="M30 100 Q60 95 90 100" 
        stroke="url(#greenAccent)" 
        stroke-width="2" 
        fill="none" 
        opacity="0.7"/>
</svg>
