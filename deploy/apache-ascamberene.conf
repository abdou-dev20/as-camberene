# ==========================================================================
# ASC Cambérène — vhost Apache
# ==========================================================================
# À déposer dans /etc/apache2/sites-available/ascambere.conf
#
# Apache sert le site construit (fichiers statiques) et transmet au serveur
# Node ce qui lui revient : l'API et les images téléversées. Le tout sur une
# seule origine — le navigateur ne fait donc aucune requête préalable CORS, et
# un seul certificat suffit.
#
# Ce fichier ne décrit que le port 80. Certbot ajoutera le vhost 443 et la
# redirection permanente :
#   sudo certbot --apache -d ascamberene.sn -d www.ascamberene.sn
#
# Modules requis :
#   sudo a2enmod proxy proxy_http rewrite headers expires deflate

<VirtualHost *:80>
    ServerName ascamberene.sn
    ServerAlias www.ascamberene.sn

    DocumentRoot /var/www/as-camberene/frontend/dist

    ErrorLog  ${APACHE_LOG_DIR}/ascambere-error.log
    CustomLog ${APACHE_LOG_DIR}/ascambere-access.log combined

    # ----------------------------------------------------------------------
    # API et médias : transmis au serveur Node
    # ----------------------------------------------------------------------
    # Déclarés avant le reste : mod_proxy tranche avant que la requête ne
    # cherche un fichier sur le disque, et /api ne tombera donc jamais sur le
    # repli SPA ci-dessous.
    ProxyPreserveHost On
    ProxyTimeout 30

    # Envois d'images jusqu'à 150 Mo : délai à part, déclaré avant /api.
    LimitRequestBody 167772160
    ProxyPass        /api/uploads http://127.0.0.1:4100/api/uploads timeout=900
    ProxyPassReverse /api/uploads http://127.0.0.1:4100/api/uploads

    ProxyPass        /api     http://127.0.0.1:4100/api
    ProxyPassReverse /api     http://127.0.0.1:4100/api

    ProxyPass        /uploads http://127.0.0.1:4100/uploads
    ProxyPassReverse /uploads http://127.0.0.1:4100/uploads

    # Images stockées sur RustFS : l'API les relit et les sert.
    ProxyPass        /media http://127.0.0.1:4100/media
    ProxyPassReverse /media http://127.0.0.1:4100/media

    # Rien d'autre ne part vers Node.
    ProxyPass /  !

    # ----------------------------------------------------------------------
    # Site construit
    # ----------------------------------------------------------------------
    <Directory /var/www/as-camberene/frontend/dist>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None

        # Application à page unique : toute route inconnue rend index.html,
        # et c'est le routeur du navigateur qui décide quoi afficher. Sans
        # cela, un rechargement sur /admin/commandes donnerait un 404 Apache.
        FallbackResource /index.html
    </Directory>

    # Les fichiers de /assets/ portent une empreinte dans leur nom : un
    # changement de contenu change le nom, ils peuvent donc être gardés
    # indéfiniment.
    <Directory /var/www/as-camberene/frontend/dist/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    # index.html, lui, ne doit jamais être servi depuis un cache : c'est lui
    # qui désigne la version des assets.
    <Files "index.html">
        Header set Cache-Control "no-cache, must-revalidate"
    </Files>

    <IfModule mod_deflate.c>
        # `text/javascript` est indispensable : c'est le type qu'Apache donne
        # aux fichiers .js, et l'omettre laisse passer le bundle — le plus gros
        # fichier du site — sans compression.
        AddOutputFilterByType DEFLATE \
            text/html text/plain text/css text/javascript \
            application/javascript application/json application/xml \
            image/svg+xml
    </IfModule>

    # En-têtes de sécurité courants. `Strict-Transport-Security` est à activer
    # une fois le certificat en place et vérifié — pas avant, sous peine de
    # rendre le domaine inaccessible en clair sans retour possible.
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</VirtualHost>
