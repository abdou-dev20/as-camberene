# ==========================================================================
# ASC Cambérène — pile de production
# ==========================================================================
#   ./deploy/docker.sh up
#
# La base est hébergée ailleurs — MongoDB Atlas — et n'est donc pas dans cette
# pile : `MONGODB_URI` la désigne. Pour une base en conteneur, ajouter le
# fichier docker-compose.local-db.yml (voir deploy/README.md).
#
# Seul `web` publie un port, et seulement sur la boucle locale : c'est l'Apache
# de l'hôte qui expose le site au monde, et qui porte le certificat.

name: asc-camberene

services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4100
      # Atlas : mongodb+srv://<user>:<mdp>@<cluster>/<base>?retryWrites=true&w=majority
      #
      # Sans `:?` : Compose interpole ce fichier avant d'appliquer la surcouche
      # docker-compose.local-db.yml, et une variable exigée ici empêcherait la
      # variante à base en conteneur de démarrer. C'est deploy/docker.sh qui
      # vérifie la présence de l'URI, et le serveur qui refuse de démarrer sans.
      MONGODB_URI: ${MONGODB_URI:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?renseigner JWT_ACCESS_SECRET dans .env.docker}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?renseigner JWT_REFRESH_SECRET dans .env.docker}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-2h}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      # Compte d'administration créé au démarrage s'il n'existe pas encore ;
      # un compte déjà en base n'est jamais modifié.
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      DEFAULT_ADMIN_NAME: ${DEFAULT_ADMIN_NAME:-}
      # Adresse publique du site : les pages d'aperçu de partage composent avec
      # elle les liens et les adresses absolues des images, que les réseaux
      # chargent depuis leurs propres serveurs.
      SITE_URL: ${SITE_URL:-https://ascamberene.sn}
      CORS_ORIGINS: ${SITE_URL:-https://ascamberene.sn}
      UPLOAD_DIR: uploads
      # 150 Mo : les photos brutes des appareils doivent passer telles quelles.
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-157286400}
      # Deux proxys devant l'API : l'Apache de l'hôte, puis celui du conteneur.
      # Sans ce nombre, la limite de débit compterait tout le trafic comme
      # venant d'un seul visiteur.
      TRUST_PROXY: 2
      # Dons en ligne. Vides, la page des dons annonce qu'ils ne sont pas
      # encore ouverts ; le reste du site n'en dépend pas.
      PAYTECH_API_KEY: ${PAYTECH_API_KEY:-}
      PAYTECH_API_SECRET: ${PAYTECH_API_SECRET:-}
      PAYTECH_ENV: ${PAYTECH_ENV:-test}
      # Images sur RustFS. Vides, elles restent dans le volume `uploads`.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      # Les images téléversées survivent aux reconstructions d'image. Elles ne
      # sont pas dans la base : cette pile a donc bien un état à sauvegarder,
      # même avec une base distante.
      - uploads:/app/uploads

  web:
    build:
      context: ./frontend
      args:
        # Figée dans le bundle à la construction : changer SITE_URL impose de
        # reconstruire l'image, pas seulement de redémarrer le conteneur.
        VITE_SITE_API_URL: ${SITE_URL:-https://ascamberene.sn}
        VITE_API_URL: ${FCONNECT_URL:-}
        VITE_CLUB_ID: ${CLUB_ID:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Boucle locale uniquement : rien n'est exposé directement sur Internet.
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      # Drapeau de blocage du site (deploy/docker.sh bloquer / debloquer).
      - etat:/usr/local/apache2/etat

volumes:
  uploads:
  etat:
